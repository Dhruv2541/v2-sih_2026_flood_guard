<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Assam Flood Guard — Live Flood Risk Prediction Platform</title>
  <desc id="hero-desc">Smart India Hackathon prototype for real-time ~6-hour flood risk forecasting across 180 micro-regions in Assam's Brahmaputra and Barak river basins.</desc>

  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914" />
      <stop offset="50%" stop-color="#081426" />
      <stop offset="100%" stop-color="#030710" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0099ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1b30" />
      <stop offset="100%" stop-color="#07101f" />
    </linearGradient>

    <linearGradient id="telemetry-bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Hydro Wave Pattern -->
    <pattern id="hydro-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#132744" stroke-width="0.75" stroke-opacity="0.45" />
      <circle cx="40" cy="40" r="1" fill="#00d2ff" fill-opacity="0.25" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Canvas with Rounded Border -->
  <rect width="1200" height="420" rx="24" fill="url(#bg-grad)" stroke="#1a3254" stroke-width="1.5" />

  <!-- Technical Grid Texture Overlay -->
  <rect width="1200" height="420" rx="24" fill="url(#hydro-grid)" />

  <!-- River Flow Aesthetic Water Ribbons (Brahmaputra Curves) -->
  <path d="M -50 360 C 250 390, 450 320, 700 370 C 950 420, 1100 330, 1250 350" fill="none" stroke="#0099ff" stroke-width="1.5" stroke-opacity="0.2" />
  <path d="M -50 380 C 280 410, 500 340, 750 390 C 1000 440, 1120 350, 1250 370" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.15" />

  <!-- ================= LEFT COLUMN: HERO INFORMATION ================= -->
  <!-- Top Eyebrow Badge -->
  <g transform="translate(60, 48)">
    <rect width="310" height="30" rx="15" fill="#0a223d" stroke="#00d2ff" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="16" cy="15" r="4.5" fill="#10b981" filter="url(#badge-glow)" />
    <text x="32" y="19" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">SMART INDIA HACKATHON 2026</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="126" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    ASSAM FLOOD GUARD
  </text>

  <!-- Subtitle with Gradient Accent -->
  <text x="60" y="162" fill="url(#cyan-glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="0.2">
    Autonomous Live Flood Risk Forecasting &amp; Early-Warning System
  </text>

  <!-- Plain-Language Value Description -->
  <text x="60" y="202" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
    High-resolution ~6-hour hydrological forecasting across 180 micro-regions
  </text>
  <text x="60" y="226" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
    in Assam's Brahmaputra &amp; Barak river basins with automated sensor telemetry.
  </text>

  <!-- Key Capability Tags -->
  <g transform="translate(60, 260)">
    <!-- Pill 1 -->
    <rect width="140" height="34" rx="8" fill="#0a192f" stroke="#1e3a5f" stroke-width="1" />
    <circle cx="18" cy="17" r="4" fill="#38bdf8" />
    <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">180 Micro-Regions</text>

    <!-- Pill 2 -->
    <rect x="150" width="145" height="34" rx="8" fill="#0a192f" stroke="#1e3a5f" stroke-width="1" />
    <circle cx="168" cy="17" r="4" fill="#f59e0b" />
    <text x="182" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">6h Forecast Horizon</text>

    <!-- Pill 3 -->
    <rect x="305" width="135" height="34" rx="8" fill="#0a192f" stroke="#1e3a5f" stroke-width="1" />
    <circle cx="323" cy="17" r="4" fill="#10b981" />
    <text x="337" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">358 Tests Passing</text>

    <!-- Pill 4 -->
    <rect x="450" width="140" height="34" rx="8" fill="#0a192f" stroke="#1e3a5f" stroke-width="1" />
    <circle cx="468" cy="17" r="4" fill="#a855f7" />
    <text x="482" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">FastAPI + React 19</text>
  </g>

  <!-- Technical Specs Monospace Strip -->
  <g transform="translate(60, 320)">
    <rect width="530" height="52" rx="10" fill="#06101e" stroke="#152842" stroke-width="1" />
    <text x="20" y="24" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="0.5">INGESTION ENGINE</text>
    <text x="20" y="42" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500">Open-Meteo • CWC Gauges • 1h/3h/6h/24h</text>

    <line x1="280" y1="12" x2="280" y2="40" stroke="#152842" stroke-width="1" />

    <text x="300" y="24" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="0.5">PERSISTENCE &amp; DB</text>
    <text x="300" y="42" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500">PostgreSQL (Supabase) • Atomic UPSERT</text>
  </g>

  <!-- ================= RIGHT COLUMN: LIVE HYDRO HUD ================= -->
  <g transform="translate(640, 42)">
    <!-- Container Card -->
    <rect width="500" height="336" rx="16" fill="url(#card-grad)" stroke="#1a3458" stroke-width="1.5" />

    <!-- Terminal Header -->
    <g transform="translate(20, 20)">
      <circle cx="8" cy="8" r="4.5" fill="#ef4444" opacity="0.8" />
      <circle cx="26" cy="8" r="4.5" fill="#f59e0b" opacity="0.8" />
      <circle cx="44" cy="8" r="4.5" fill="#10b981" opacity="0.8" />
      <text x="64" y="12" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">LIVE HYDRO-TELEMETRY HUD</text>
      
      <!-- Live Pulse Beacon -->
      <circle cx="440" cy="8" r="4" fill="#10b981" filter="url(#badge-glow)" />
      <text x="400" y="12" fill="#10b981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">ONLINE</text>
    </g>

    <!-- Divider Line -->
    <line x1="20" y1="46" x2="480" y2="46" stroke="#152b47" stroke-width="1" />

    <!-- River Basin Telemetry Table -->
    <g transform="translate(20, 62)">
      <!-- Row 1: Dibrugarh (High Alert) -->
      <rect width="460" height="42" rx="8" fill="#0d1829" stroke="#1d3557" stroke-width="1" />
      <text x="16" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Dibrugarh Station</text>
      <text x="160" y="26" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">104.8m (+0.6m/h)</text>
      <rect x="340" y="11" width="105" height="22" rx="6" fill="#7f1d1d" />
      <text x="392" y="26" text-anchor="middle" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">HIGH (0.71)</text>

      <!-- Row 2: Silchar / Barak (Critical Surge) -->
      <g transform="translate(0, 48)">
        <rect width="460" height="42" rx="8" fill="#0d1829" stroke="#1d3557" stroke-width="1" />
        <text x="16" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Silchar (Barak)</text>
        <text x="160" y="26" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">19.3m (+0.9m/h)</text>
        <rect x="340" y="11" width="105" height="22" rx="6" fill="#991b1b" stroke="#ef4444" stroke-width="1" />
        <text x="392" y="26" text-anchor="middle" fill="#fee2e2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="800">CRITICAL (0.84)</text>
      </g>

      <!-- Row 3: Guwahati (Normal Baseline) -->
      <g transform="translate(0, 96)">
        <rect width="460" height="42" rx="8" fill="#0d1829" stroke="#1d3557" stroke-width="1" />
        <text x="16" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Guwahati Sector</text>
        <text x="160" y="26" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">48.2m (+0.1m/h)</text>
        <rect x="340" y="11" width="105" height="22" rx="6" fill="#064e3b" />
        <text x="392" y="26" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">LOW (0.12)</text>
      </g>
    </g>

    <!-- Bottom Telemetry Risk Meter Strip -->
    <g transform="translate(20, 224)">
      <text x="0" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">COMPOSITE FLOOD PROBABILITY GAUGE</text>
      <text x="460" y="16" text-anchor="end" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">0.00 → 1.00</text>
      
      <!-- Gradient Risk Bar -->
      <rect y="24" width="460" height="12" rx="6" fill="url(#telemetry-bar-grad)" />

      <!-- Risk Range Labels -->
      <text x="0" y="52" fill="#10b981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">LOW &lt;0.25</text>
      <text x="135" y="52" fill="#f59e0b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">MOD &lt;0.50</text>
      <text x="275" y="52" fill="#f97316" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">HIGH &lt;0.75</text>
      <text x="460" y="52" text-anchor="end" fill="#ef4444" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">CRITICAL ≥0.75</text>

      <!-- Active Indicator Pin -->
      <polygon points="380,20 385,12 375,12" fill="#ffffff" />
      <line x1="380" y1="20" x2="380" y2="36" stroke="#ffffff" stroke-width="2" />
    </g>
  </g>
</svg>
