<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" role="img" aria-labelledby="risk-title risk-desc">
  <title id="risk-title">Assam Flood Guard — Multi-Tier Risk Classification System</title>
  <desc id="risk-desc">Deterministic 4-tier flood risk thresholds from routine monitoring to mandatory evacuation directives.</desc>

  <defs>
    <linearGradient id="matrix-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914" />
      <stop offset="100%" stop-color="#081426" />
    </linearGradient>

    <!-- Card Glows -->
    <filter id="glow-low" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="1200" height="180" rx="16" fill="url(#matrix-bg)" stroke="#1a3254" stroke-width="1.2" />

  <!-- 4 Risk Cards Grid -->
  <!-- CARD 1: LOW -->
  <g transform="translate(30, 20)">
    <rect width="265" height="140" rx="12" fill="#081726" stroke="#065f46" stroke-width="1.5" />
    <rect x="16" y="16" width="70" height="24" rx="6" fill="#064e3b" />
    <text x="51" y="32" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700">P &lt; 0.25</text>
    
    <circle cx="235" cy="28" r="6" fill="#10b981" />

    <text x="16" y="66" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700">LOW RISK</text>
    <text x="16" y="90" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Routine Monitoring</text>
    <text x="16" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Normal flow; within riverbank buffer.</text>
    <text x="16" y="128" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Standard 60-min telemetry cycles.</text>
  </g>

  <!-- CARD 2: MODERATE -->
  <g transform="translate(315, 20)">
    <rect width="265" height="140" rx="12" fill="#081726" stroke="#854d0e" stroke-width="1.5" />
    <rect x="16" y="16" width="95" height="24" rx="6" fill="#713f12" />
    <text x="63" y="32" text-anchor="middle" fill="#fde047" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700">0.25 ≤ P &lt; 0.50</text>
    
    <circle cx="235" cy="28" r="6" fill="#f59e0b" />

    <text x="16" y="66" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700">MODERATE</text>
    <text x="16" y="90" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Advisory Watch</text>
    <text x="16" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Accelerated runoff &amp; saturated soil.</text>
    <text x="16" y="128" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Field inspection teams put on notice.</text>
  </g>

  <!-- CARD 3: HIGH -->
  <g transform="translate(600, 20)">
    <rect width="265" height="140" rx="12" fill="#081726" stroke="#9a3412" stroke-width="1.5" />
    <rect x="16" y="16" width="95" height="24" rx="6" fill="#7c2d12" />
    <text x="63" y="32" text-anchor="middle" fill="#fdba74" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700">0.50 ≤ P &lt; 0.75</text>
    
    <circle cx="235" cy="28" r="6" fill="#f97316" />

    <text x="16" y="66" fill="#f97316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700">HIGH RISK</text>
    <text x="16" y="90" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Warning Triggered</text>
    <text x="16" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Water breaches danger gauge mark.</text>
    <text x="16" y="128" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Shelters activated, alerts dispatched.</text>
  </g>

  <!-- CARD 4: CRITICAL -->
  <g transform="translate(885, 20)">
    <rect width="285" height="140" rx="12" fill="#140a10" stroke="#991b1b" stroke-width="1.8" />
    <rect x="16" y="16" width="75" height="24" rx="6" fill="#7f1d1d" />
    <text x="53" y="32" text-anchor="middle" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700">P ≥ 0.75</text>
    
    <circle cx="255" cy="28" r="6" fill="#ef4444" />

    <text x="16" y="66" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700">CRITICAL</text>
    <text x="16" y="90" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Evacuation Directive</text>
    <text x="16" y="112" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Severe inundation imminent (&lt;6 hrs).</text>
    <text x="16" y="128" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Automated sirens &amp; NDRF mobilization.</text>
  </g>
</svg>
