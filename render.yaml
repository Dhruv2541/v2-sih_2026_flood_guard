services:
  - type: web
    name: floodguard-api
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PREDICTION_MODE
        value: baseline
      - key: SCHEDULER_ENABLED
        value: false
      - key: INGESTION_INTERVAL_MINUTES
        value: 60
      # Add these in Render dashboard as secret env vars:
      # - DATABASE_URL (from Supabase)
      # - CORS_ORIGINS (your Vercel frontend URL)
      # - OPEN_METEO_TIMEOUT_SECONDS=10.0